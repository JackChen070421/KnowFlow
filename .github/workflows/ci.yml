name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Contract check (structure, schemas, data hygiene)
        run: python scripts/check_contracts.py

      - name: Validate synthetic CSV examples
        run: python scripts/check_examples.py

      - name: Tests
        run: python -m pytest -q

      - name: Validate fixtures
        run: |
          python scripts/validate_outputs.py \
            --schema schemas/output/student_profile.schema.json \
            --data tests/fixtures/student_profile.min.json
          python scripts/validate_outputs.py \
            --schema schemas/output/recommendation.schema.json \
            --data tests/fixtures/recommendation.min.json
