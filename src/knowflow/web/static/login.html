<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="KnowFlow 智慧学伴：从课程要求、学情证据到可验证的学习行动。">
  <title>登录 · KnowFlow 智慧学伴</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/login.css">
  <script type="module" src="/login.js"></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-brand">
        <img src="/favicon.svg" alt="" width="44" height="44">
        <div>
          <strong>KnowFlow</strong>
          <small>智慧学伴 · 本机工作台</small>
        </div>
      </header>
      <h1 id="login-title">登录</h1>
      <p class="login-sub">教师账号进入班级学情；学生账号进入自己的学习主界面。</p>
      <form id="login-form" novalidate>
        <label class="login-field">
          <span>用户名</span>
          <input id="username" name="username" autocomplete="username" required
                 placeholder="教师填 teacher，学生填学号" spellcheck="false">
        </label>
        <label class="login-field">
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required
                 placeholder="请输入密码">
        </label>
        <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
        <button id="login-submit" class="login-button" type="submit">登录</button>
      </form>
      <footer class="login-foot">
        <p>本机演示账号：<code>teacher</code> / <code class="password-hint">123456</code>，学生账号为学号（如 <code>S001</code>）。</p>
        <p class="login-note">数据只在本机处理；登录状态保存在本次运行的内存中，关闭启动窗口即失效。</p>
      </footer>
    </section>
  </main>
</body>
</html>
