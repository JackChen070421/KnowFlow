name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, fast gate: fails when pyproject changed but uv.lock did not.
  lock:
    name: lock up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: uv lock --check
        run: uv lock --check

  contract-and-tests:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-uv installs the matrix interpreter and caches the wheel cache.
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --frozen: never re-resolve; the committed uv.lock decides what runs.
      - name: Install (frozen lock)
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Contract check (structure, schemas, data hygiene)
        run: uv run --frozen --extra dev python scripts/check_contracts.py

      - name: Validate synthetic CSV examples
        run: uv run --frozen --extra dev python scripts/check_examples.py

      - name: Tests
        run: uv run --frozen --extra dev python -m pytest -q

      - name: Validate fixtures
        run: |
          uv run --frozen --extra dev python scripts/validate_outputs.py \
            --schema schemas/output/student_profile.schema.json \
            --data tests/fixtures/student_profile.min.json
          uv run --frozen --extra dev python scripts/validate_outputs.py \
            --schema schemas/output/recommendation.schema.json \
            --data tests/fixtures/recommendation.min.json

      - name: CLI smoke test
        run: uv run --frozen --extra dev python -m knowflow.cli check
