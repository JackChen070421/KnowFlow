[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "knowflow"
version = "0.1.0"
description = "KnowFlow: evidence-traceable learning diagnosis and personalized recommendations for the Smart Learning Companion track."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "KnowFlow Team" }]
keywords = ["education", "learning-diagnosis", "recommendation", "harness-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "jsonschema>=4.20",
  "referencing>=0.30",
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
app = [
  "streamlit>=1.35",
  "plotly>=5.20",
]
llm = [
  "openai>=1.30",
]

[project.scripts]
knowflow = "knowflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:knowflow.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src/knowflow"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
